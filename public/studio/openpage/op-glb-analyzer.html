<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OP Creator Studio · GLB Analyzer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --surface2: #111111;
    --surface3: #161616;
    --border: #1e1e1e;
    --border-light: #2a2a2a;
    --text: #f0f0f0;
    --text-secondary: #a0a0a0;
    --text-dim: #666666;
    --accent: #ffffff;
    --accent-dim: rgba(255, 255, 255, 0.08);
    --pass: #4ade80;
    --pass-bg: rgba(74, 222, 128, 0.08);
    --pass-border: rgba(74, 222, 128, 0.15);
    --fail: #ef4444;
    --fail-bg: rgba(239, 68, 68, 0.08);
    --fail-border: rgba(239, 68, 68, 0.15);
    --warn: #f59e0b;
    --warn-bg: rgba(245, 158, 11, 0.08);
    --warn-border: rgba(245, 158, 11, 0.15);
    --info: #818cf8;
    --info-bg: rgba(129, 140, 248, 0.08);
  }

  body {
    font-family: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .app-header {
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
  }

  .app-header .logo-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
  .app-header .logo-icon svg { width: 30px; height: 18px; }
  .app-header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; color: var(--text); }
  .app-header .subtitle { color: var(--text-dim); font-size: 12px; margin-left: auto; font-weight: 400; }

  .mode-toggle {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    gap: 2px;
    margin-left: 16px;
  }

  .mode-btn {
    padding: 5px 14px; border: none; border-radius: 6px; font-size: 12px; font-weight: 500;
    cursor: pointer; background: transparent; color: var(--text-dim); transition: all 0.15s; font-family: inherit;
  }

  .mode-btn.active { background: var(--accent); color: var(--bg); }
  .mode-btn:not(.active):hover { color: var(--text-secondary); }

  .main-layout { display: grid; grid-template-columns: 1fr 400px; height: calc(100vh - 61px); }

  .viewer-panel { position: relative; background: var(--bg); display: flex; align-items: center; justify-content: center; }
  #three-canvas { width: 100%; height: 100%; display: none; }

  .drop-zone {
    position: absolute; inset: 20px; border: 1px dashed var(--border-light); border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    transition: all 0.2s; cursor: pointer; z-index: 10;
  }

  .drop-zone.active { border-color: var(--text-secondary); background: var(--accent-dim); }
  .drop-zone.hidden { display: none; }

  .drop-icon {
    width: 64px; height: 64px; border-radius: 16px; background: var(--surface2);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
  }

  .drop-icon svg { width: 28px; height: 28px; stroke: var(--text-secondary); }
  .drop-zone h2 { font-size: 17px; font-weight: 600; color: var(--text); }
  .drop-zone p { color: var(--text-dim); font-size: 13px; }
  .drop-mode-label { color: var(--text-secondary); font-size: 12px; font-weight: 500; }

  .drop-zone .or-browse {
    margin-top: 4px; padding: 9px 22px; background: var(--accent); color: var(--bg); border: none;
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity 0.2s;
  }

  .drop-zone .or-browse:hover { opacity: 0.85; }
  #file-input { display: none; }

  .analysis-panel {
    background: var(--surface); border-left: 1px solid var(--border);
    overflow-y: auto; display: flex; flex-direction: column;
  }

  .analysis-panel::-webkit-scrollbar { width: 6px; }
  .analysis-panel::-webkit-scrollbar-track { background: transparent; }
  .analysis-panel::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

  .panel-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: var(--surface); z-index: 2;
  }

  .panel-mode-tag { font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .panel-mode-tag.avatar { background: var(--accent-dim); color: var(--text-secondary); border: 1px solid var(--border-light); }
  .panel-mode-tag.wearable { background: var(--info-bg); color: var(--info); border: 1px solid rgba(129,140,248,0.15); }

  .panel-content { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }

  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 13px; padding: 40px; text-align: center; line-height: 1.7;
  }

  .status-badge {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    border-radius: 8px; font-weight: 500; font-size: 13px;
  }

  .status-badge.pass { background: var(--pass-bg); color: var(--pass); border: 1px solid var(--pass-border); }
  .status-badge.fail { background: var(--fail-bg); color: var(--fail); border: 1px solid var(--fail-border); }
  .status-badge.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); }
  .status-icon { font-size: 14px; }
  .issues-list { display: flex; flex-direction: column; gap: 4px; }

  .metric-group { display: flex; flex-direction: column; gap: 1px; border-radius: 10px; overflow: hidden; }

  .metric-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 14px; background: var(--surface2);
  }

  .metric-label { font-size: 12px; color: var(--text-dim); font-weight: 400; }

  .metric-value { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
  .metric-value.pass { color: var(--pass); }
  .metric-value.fail { color: var(--fail); }
  .metric-value.warn { color: var(--warn); }

  .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); font-weight: 600; margin-top: 4px; }

  .height-visual { background: var(--surface2); border-radius: 10px; padding: 14px; }

  .height-bar-container {
    position: relative; height: 160px; width: 100%; margin: 10px 0 6px;
    border-radius: 6px; background: var(--surface3); overflow: hidden;
  }

  .height-bar-zone {
    position: absolute; left: 0; right: 0;
    background: rgba(74, 222, 128, 0.05);
    border-top: 1px dashed rgba(74, 222, 128, 0.2);
    border-bottom: 1px dashed rgba(74, 222, 128, 0.2);
  }

  .height-bar-zone-label {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-size: 9px; color: var(--pass); opacity: 0.5; font-weight: 500;
    letter-spacing: 0.05em; text-transform: uppercase;
  }

  .height-bar-indicator {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 36px; border-radius: 3px 3px 0 0; transition: height 0.5s ease, background 0.3s;
  }

  .height-bar-label { position: absolute; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 600; white-space: nowrap; }
  .height-range-labels { display: flex; justify-content: space-between; font-size: 9px; color: var(--text-dim); font-weight: 500; }

  .node-tag {
    display: inline-block; padding: 3px 8px; background: var(--fail-bg); color: var(--fail);
    border: 1px solid var(--fail-border); border-radius: 4px; font-size: 10px; font-weight: 600; margin: 2px 4px 2px 0;
  }

  /* Primitive breakdown table */
  .prim-breakdown { display: flex; flex-direction: column; gap: 1px; border-radius: 10px; overflow: hidden; }

  .prim-row {
    display: grid; grid-template-columns: 1fr 50px 50px 50px;
    padding: 7px 12px; background: var(--surface2); font-size: 11px; gap: 6px; align-items: center;
  }

  .prim-row.header {
    color: var(--text-dim); font-weight: 600; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }

  .prim-row .prim-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prim-row .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

  .prim-row.hotspot { background: var(--fail-bg); border-left: 2px solid var(--fail); }

  /* Hotspot callout */
  .hotspot-callout {
    background: var(--fail-bg); border: 1px solid var(--fail-border); border-radius: 8px;
    padding: 10px 14px; font-size: 12px; color: var(--fail); line-height: 1.5;
  }

  .hotspot-callout strong { font-weight: 600; }

  .viewer-controls { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: none; gap: 6px; z-index: 5; flex-wrap: wrap; justify-content: center; }
  .viewer-controls.visible { display: flex; }

  .viewer-btn {
    padding: 7px 14px; background: rgba(10, 10, 10, 0.9); border: 1px solid var(--border-light);
    color: var(--text-secondary); border-radius: 6px; font-size: 11px; font-weight: 500;
    cursor: pointer; backdrop-filter: blur(12px); transition: all 0.15s; font-family: inherit;
  }

  .viewer-btn:hover { background: var(--surface3); color: var(--text); }
  .viewer-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .loading-overlay {
    position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85);
    display: none; align-items: center; justify-content: center; z-index: 20; flex-direction: column; gap: 14px;
  }

  .loading-overlay.visible { display: flex; }

  .spinner { width: 32px; height: 32px; border: 2px solid var(--border-light); border-top-color: var(--text); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .new-file-btn {
    position: absolute; top: 14px; right: 14px; padding: 7px 12px; background: var(--surface);
    border: 1px solid var(--border-light); color: var(--text-secondary); border-radius: 6px;
    font-size: 11px; font-weight: 500; cursor: pointer; z-index: 5; display: none; font-family: inherit; transition: all 0.15s;
  }

  .new-file-btn:hover { background: var(--surface2); color: var(--text); }

  /* URL input bar */
  .url-bar {
    display: flex;
    gap: 6px;
    width: 100%;
    max-width: 480px;
    margin-top: 6px;
  }

  .url-bar input {
    flex: 1;
    padding: 9px 14px;
    background: var(--surface2);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }

  .url-bar input::placeholder { color: var(--text-dim); }
  .url-bar input:focus { border-color: var(--text-secondary); }

  .url-bar button {
    padding: 9px 16px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: opacity 0.15s;
  }

  .url-bar button:hover { opacity: 0.85; }
  .url-bar button:disabled { opacity: 0.4; cursor: not-allowed; }

  .url-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 480px;
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 500;
  }

  .url-divider::before, .url-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-light);
  }

  .url-error {
    font-size: 11px;
    color: var(--fail);
    max-width: 480px;
    text-align: center;
    display: none;
  }

  /* Animation controls */
  .anim-controls {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 6px;
    z-index: 5;
    background: rgba(10, 10, 10, 0.92);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    padding: 6px 10px;
    backdrop-filter: blur(12px);
  }

  .anim-controls.visible { display: flex; }

  .anim-controls .anim-label {
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-right: 4px;
  }

  .anim-controls .anim-name {
    font-size: 11px;
    color: var(--text-secondary);
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-right: 6px;
  }

  .anim-btn {
    width: 28px; height: 28px; border: 1px solid var(--border-light); border-radius: 5px;
    background: transparent; color: var(--text-secondary); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
    font-size: 14px;
  }

  .anim-btn:hover { background: var(--surface3); color: var(--text); }
  .anim-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .anim-speed {
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 600;
    padding: 0 4px;
    min-width: 32px;
    text-align: center;
  }

  .anim-timeline {
    width: 100px;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border-light);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  .anim-timeline::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .anim-remove-btn {
    padding: 4px 8px;
    border: 1px solid var(--fail-border);
    border-radius: 4px;
    background: var(--fail-bg);
    color: var(--fail);
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin-left: 4px;
  }

  .anim-remove-btn:hover { background: var(--fail); color: white; }

  #anim-file-input { display: none; }

  @media (max-width: 860px) {
    .main-layout { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; height: auto; }
    .viewer-panel { min-height: 50vh; }
    .mode-toggle { margin-left: 0; }
    .app-header { padding: 12px 16px; gap: 10px; flex-wrap: wrap; }
    .app-header h1 { font-size: 14px; }
    .anim-controls { bottom: 44px; }
  }
</style>
</head>
<body>

<div class="app-header">
  <div class="logo-icon">
    <svg viewBox="0 0 145 89" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M71.1166 3C72.0566 3 72.5766 3.6 72.7566 3.85C72.9366 4.11 73.3166 4.8 72.9966 5.68L56.1866 52.03C55.8966 52.82 55.1466 53.35 54.3066 53.35H10.0066C7.68657 53.35 5.59657 52.26 4.26657 50.36C2.93657 48.46 2.63657 46.13 3.42657 43.95L16.6766 7.6C17.6766 4.85 20.3266 3 23.2566 3H71.1166ZM71.1166 0H23.2566C19.0566 0 15.2966 2.63 13.8566 6.57L0.606566 42.92C-1.77343 49.44 3.05657 56.35 10.0066 56.35H54.3066C56.4066 56.35 58.2866 55.03 59.0066 53.06L75.8166 6.71C76.9966 3.45 74.5866 0 71.1166 0Z" fill="white"/>
      <path d="M134.514 3C136.824 3 138.914 4.09 140.244 5.98C141.574 7.88 141.884 10.21 141.094 12.39L127.904 48.74C126.904 51.5 124.254 53.35 121.324 53.35H98.6741L97.8541 54.01L58.9741 85.24L88.4141 4.31C88.7041 3.52 89.4541 3 90.2941 3H134.514ZM134.514 0H90.2941C88.1941 0 86.3141 1.31 85.5941 3.29L56.1541 84.23C55.3741 86.37 57.0841 88.27 58.9941 88.27C59.6241 88.27 60.2741 88.06 60.8541 87.59L99.7341 56.35H121.324C125.534 56.35 129.294 53.72 130.724 49.76L143.914 13.41C146.284 6.89 141.454 0 134.514 0Z" fill="white"/>
    </svg>
  </div>
  <h1>OP Creator Studio <span style="opacity:0.4;font-weight:400;">·</span> <span style="font-weight:500;letter-spacing:0.04em;">GLB Analyzer</span></h1>
  <div class="mode-toggle">
    <button class="mode-btn active" id="mode-avatar" onclick="setMode('avatar')">Avatar</button>
    <button class="mode-btn" id="mode-wearable" onclick="setMode('wearable')">Wearable</button>
  </div>
  <span class="subtitle" id="header-subtitle">Open Avatar Studio</span>
</div>

<div class="main-layout">
  <div class="viewer-panel" id="viewer-panel">
    <canvas id="three-canvas"></canvas>
    <div class="drop-zone" id="drop-zone">
      <div class="drop-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </div>
      <h2>Drop GLB File</h2>
      <p>Drag & drop or browse to analyze</p>
      <div class="drop-mode-label" id="drop-mode-label">Mode: Avatar</div>
      <button class="or-browse" onclick="document.getElementById('file-input').click()">Choose File</button>
      <input type="file" id="file-input" accept=".glb,.gltf">
      <div class="url-divider">or paste MML URL</div>
      <div class="url-bar">
        <input type="text" id="mml-url-input" placeholder="https://example.com/collection/avatar/...mml" spellcheck="false">
        <button id="mml-load-btn" onclick="loadFromMML()">Load</button>
      </div>
      <div class="url-error" id="url-error"></div>
    </div>
    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
      <span style="color: var(--text-dim); font-size: 12px; font-weight: 500;">Analyzing model...</span>
    </div>
    <button class="new-file-btn" id="new-file-btn">+ New File</button>
    <div class="anim-controls" id="anim-controls">
      <span class="anim-label">Anim</span>
      <span class="anim-name" id="anim-name" title="">—</span>
      <button class="anim-btn" id="anim-play-btn" onclick="toggleAnimPlay()" title="Play/Pause">&#9654;</button>
      <button class="anim-btn" id="anim-stop-btn" onclick="stopAnim()" title="Stop">&#9632;</button>
      <input type="range" class="anim-timeline" id="anim-timeline" min="0" max="100" value="0" step="0.5" oninput="scrubAnim(this.value)">
      <button class="anim-btn" id="anim-speed-down" onclick="changeAnimSpeed(-0.25)" title="Slow down" style="font-size:11px;">-</button>
      <span class="anim-speed" id="anim-speed">1x</span>
      <button class="anim-btn" id="anim-speed-up" onclick="changeAnimSpeed(0.25)" title="Speed up" style="font-size:11px;">+</button>
      <button class="anim-btn" id="anim-ground-btn" onclick="toggleGroundLock()" title="Lock to ground" style="font-size:9px;width:auto;padding:0 8px;font-weight:600;">GND</button>
      <button class="anim-remove-btn" onclick="removeAnimation()">Remove</button>
    </div>
    <div class="viewer-controls" id="viewer-controls">
      <button class="viewer-btn" onclick="resetCamera()">Reset View</button>
      <button class="viewer-btn" id="wireframe-btn" onclick="toggleWireframe()">Wireframe</button>
      <button class="viewer-btn" id="bbox-btn" onclick="toggleBBox()">Bounding Box</button>
      <button class="viewer-btn" id="grid-btn" onclick="toggleGrid()">Grid</button>
      <button class="viewer-btn" id="anim-load-btn" onclick="document.getElementById('anim-file-input').click()" style="display:none;">Apply Animation</button>
    </div>
    <input type="file" id="anim-file-input" accept=".glb">
  </div>

  <div class="analysis-panel" id="analysis-panel">
    <div class="panel-header">
      <span>Analysis Results</span>
      <span class="panel-mode-tag avatar" id="panel-mode-tag">Avatar</span>
    </div>
    <div class="empty-state" id="empty-state">Drop a .glb file to analyze<br>dimensions, complexity, and<br>guideline compliance</div>
    <div class="panel-content" id="results" style="display:none;"></div>
  </div>
</div>

<script>
// ===== State =====
let currentMode = 'avatar';
let scene, camera, renderer;
let currentModel = null, bboxHelper = null, gridHelper = null;
let wireframeMode = false, bboxVisible = true, gridVisible = true;
let lastGltfJson = null, lastBinChunk = null, lastFileSize = 0;

// Animation state
let mixer = null;
let clock = new THREE.Clock();
let currentAnimAction = null;
let animSpeed = 1.0;
let animPlaying = false;
let animClips = []; // animations from the loaded model itself
let externalAnimClips = []; // animations from external animation GLB
let lastModelArrayBuffer = null; // store for re-parsing if needed
let groundLocked = true; // keep model grounded during animation
let originalClips = []; // unmodified clips for toggling ground lock
let groundTargetY = 0; // pre-animation min Y to maintain

function setMode(mode) {
  currentMode = mode;
  document.getElementById('mode-avatar').classList.toggle('active', mode === 'avatar');
  document.getElementById('mode-wearable').classList.toggle('active', mode === 'wearable');
  document.getElementById('drop-mode-label').textContent = 'Mode: ' + (mode === 'avatar' ? 'Avatar' : 'Wearable');
  const tag = document.getElementById('panel-mode-tag');
  tag.textContent = mode === 'avatar' ? 'Avatar' : 'Wearable';
  tag.className = 'panel-mode-tag ' + mode;
  if (currentModel && lastGltfJson) {
    const stats = extractStats(lastGltfJson);
    const deep = extractDeepInfo(lastGltfJson, lastBinChunk);
    const a = analyzeModel(currentModel, stats, lastFileSize, deep);
    if (mode === 'avatar') renderAvatarResults(a); else renderWearableResults(a);
  }
}

// ===== Three.js =====
function initScene() {
  const canvas = document.getElementById('three-canvas');
  const container = document.getElementById('viewer-panel');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.01, 100);
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const d1 = new THREE.DirectionalLight(0xffffff, 0.9); d1.position.set(5, 10, 7); scene.add(d1);
  const d2 = new THREE.DirectionalLight(0x6666aa, 0.3); d2.position.set(-5, 5, -5); scene.add(d2);
  gridHelper = new THREE.GridHelper(10, 20, 0x1a1a1a, 0x0d0d0d);
  scene.add(gridHelper);
  initOrbitControls(canvas);
  window.addEventListener('resize', onResize);
  animate();
}

let orbitState = { theta: Math.PI/4, phi: Math.PI/4, radius: 3, target: new THREE.Vector3(0, 0.8, 0) };
let isDragging = false, lastMouse = { x: 0, y: 0 };

function initOrbitControls(c) {
  c.addEventListener('mousedown', e => { isDragging = true; lastMouse = { x: e.clientX, y: e.clientY }; });
  window.addEventListener('mouseup', () => isDragging = false);
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    orbitState.theta -= (e.clientX - lastMouse.x) * 0.005;
    orbitState.phi = Math.max(0.1, Math.min(Math.PI - 0.1, orbitState.phi - (e.clientY - lastMouse.y) * 0.005));
    lastMouse = { x: e.clientX, y: e.clientY }; updateCamera();
  });
  c.addEventListener('wheel', e => { e.preventDefault(); orbitState.radius = Math.max(0.5, Math.min(15, orbitState.radius + e.deltaY * 0.003)); updateCamera(); }, { passive: false });
  let lT = null, lTD = null;
  c.addEventListener('touchstart', e => { if (e.touches.length === 1) lT = { x: e.touches[0].clientX, y: e.touches[0].clientY }; else if (e.touches.length === 2) lTD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); });
  c.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && lT) { orbitState.theta -= (e.touches[0].clientX - lT.x) * 0.005; orbitState.phi = Math.max(0.1, Math.min(Math.PI - 0.1, orbitState.phi - (e.touches[0].clientY - lT.y) * 0.005)); lT = { x: e.touches[0].clientX, y: e.touches[0].clientY }; updateCamera(); }
    else if (e.touches.length === 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); if (lTD) { orbitState.radius = Math.max(0.5, Math.min(15, orbitState.radius - (d - lTD) * 0.01)); updateCamera(); } lTD = d; }
  }, { passive: false });
  c.addEventListener('touchend', () => { lT = null; lTD = null; });
  updateCamera();
}

function updateCamera() {
  const { theta, phi, radius, target } = orbitState;
  camera.position.set(target.x + radius * Math.sin(phi) * Math.cos(theta), target.y + radius * Math.cos(phi), target.z + radius * Math.sin(phi) * Math.sin(theta));
  camera.lookAt(target);
}

function resetCamera() { orbitState = { theta: Math.PI/4, phi: Math.PI/4, radius: 3, target: new THREE.Vector3(0, 0.8, 0) }; updateCamera(); }

function onResize() {
  const c = document.getElementById('viewer-panel');
  camera.aspect = c.clientWidth / c.clientHeight; camera.updateProjectionMatrix();
  renderer.setSize(c.clientWidth, c.clientHeight);
}

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (mixer && animPlaying) {
    mixer.update(delta);
    // Keep model grounded: adjust Y so feet stay at pre-animation level
    if (groundLocked && currentModel) {
      const box = new THREE.Box3().setFromObject(currentModel);
      const drift = box.min.y - groundTargetY;
      if (Math.abs(drift) > 0.001) {
        currentModel.position.y -= drift;
      }
    }
    // Update timeline slider
    if (currentAnimAction) {
      const clip = currentAnimAction.getClip();
      const time = currentAnimAction.time;
      const pct = (time / clip.duration) * 100;
      document.getElementById('anim-timeline').value = pct;
    }
  }
  renderer.render(scene, camera);
}

// ===== GLB Parser (custom for stats) =====
function parseGLBChunks(ab) {
  const dv = new DataView(ab);
  if (dv.getUint32(0, true) !== 0x46546C67) throw new Error('Not a valid GLB file');
  const len = dv.getUint32(8, true);
  let off = 12, json = null, bin = null;
  while (off < len) {
    const cl = dv.getUint32(off, true), ct = dv.getUint32(off + 4, true), cd = ab.slice(off + 8, off + 8 + cl);
    if (ct === 0x4E4F534A) json = JSON.parse(new TextDecoder().decode(cd));
    else if (ct === 0x004E4942) bin = cd;
    off += 8 + cl;
  }
  if (!json) throw new Error('No JSON chunk found');
  return { json, bin };
}

// ===== Load GLB using GLTFLoader =====
async function loadGLB(ab) {
  // Parse JSON chunk for stats extraction
  const { json, bin } = parseGLBChunks(ab);
  lastGltfJson = json;
  lastBinChunk = bin;

  // Use GLTFLoader for proper scene building (handles bones, skins, animations)
  const gltf = await new Promise((resolve, reject) => {
    const loader = new THREE.GLTFLoader();
    loader.parse(ab, '', resolve, (err) => reject(new Error(err.message || 'GLTFLoader parse error')));
  });

  const group = gltf.scene;

  // Store model animations
  animClips = gltf.animations || [];

  return { group, stats: extractStats(json) };
}

// ===== Load Animation from external GLB =====
async function loadAnimationGLB(ab) {
  const gltf = await new Promise((resolve, reject) => {
    const loader = new THREE.GLTFLoader();
    loader.parse(ab, '', resolve, (err) => reject(new Error(err.message || 'GLTFLoader parse error')));
  });
  return gltf.animations || [];
}

// ===== Apply animation to current model =====
function applyAnimation(clips, name) {
  if (!currentModel || clips.length === 0) return;

  // Stop any existing animation
  stopAnim();

  // Store originals for ground lock toggling
  originalClips = clips;

  // Record pre-animation ground level (where the feet are before animation moves things)
  if (groundLocked) {
    // Reset model position to get clean measurement
    currentModel.position.y = 0;
    const preBox = new THREE.Box3().setFromObject(currentModel);
    groundTargetY = preBox.min.y;
  }

  // Create mixer on the current model
  mixer = new THREE.AnimationMixer(currentModel);

  // Use the first clip
  const clip = clips[0];
  currentAnimAction = mixer.clipAction(clip);
  currentAnimAction.play();
  animPlaying = true;
  animSpeed = 1.0;

  // Show animation controls
  const animName = name || clip.name || 'Animation';
  document.getElementById('anim-name').textContent = animName;
  document.getElementById('anim-name').title = animName;
  document.getElementById('anim-controls').classList.add('visible');
  document.getElementById('anim-play-btn').innerHTML = '&#10074;&#10074;';
  document.getElementById('anim-speed').textContent = '1x';
  document.getElementById('anim-ground-btn').classList.toggle('active', groundLocked);

  // Reset clock to avoid large first delta
  clock.getDelta();
}

// ===== Toggle ground lock =====
function toggleGroundLock() {
  groundLocked = !groundLocked;
  document.getElementById('anim-ground-btn').classList.toggle('active', groundLocked);

  if (!groundLocked && currentModel) {
    // Reset any Y offset we applied
    currentModel.position.y = 0;
  } else if (groundLocked && currentModel) {
    // Re-capture ground target from current state
    const tempY = currentModel.position.y;
    currentModel.position.y = 0;
    const box = new THREE.Box3().setFromObject(currentModel);
    groundTargetY = box.min.y;
    currentModel.position.y = tempY;
  }
}

// ===== Animation Controls =====
function toggleAnimPlay() {
  if (!currentAnimAction) return;
  animPlaying = !animPlaying;
  if (animPlaying) {
    currentAnimAction.paused = false;
    document.getElementById('anim-play-btn').innerHTML = '&#10074;&#10074;';
    clock.getDelta(); // reset delta
  } else {
    currentAnimAction.paused = true;
    document.getElementById('anim-play-btn').innerHTML = '&#9654;';
  }
}

function stopAnim() {
  if (mixer) {
    mixer.stopAllAction();
    mixer = null;
  }
  currentAnimAction = null;
  animPlaying = false;
  document.getElementById('anim-play-btn').innerHTML = '&#9654;';
  document.getElementById('anim-timeline').value = 0;
}

function scrubAnim(pct) {
  if (!currentAnimAction) return;
  const clip = currentAnimAction.getClip();
  const wasPlaying = animPlaying;
  if (wasPlaying) {
    currentAnimAction.paused = true;
    animPlaying = false;
    document.getElementById('anim-play-btn').innerHTML = '&#9654;';
  }
  currentAnimAction.time = (pct / 100) * clip.duration;
  mixer.update(0); // force update at this time
}

function changeAnimSpeed(delta) {
  animSpeed = Math.max(0.25, Math.min(3.0, animSpeed + delta));
  document.getElementById('anim-speed').textContent = animSpeed.toFixed(animSpeed % 1 === 0 ? 0 : 2) + 'x';
  if (currentAnimAction) {
    currentAnimAction.setEffectiveTimeScale(animSpeed);
  }
}

function removeAnimation() {
  stopAnim();
  externalAnimClips = [];
  document.getElementById('anim-controls').classList.remove('visible');

  // Reset model to bind pose by re-parsing
  if (lastModelArrayBuffer) {
    reloadModelWithoutAnimation();
  }
}

async function reloadModelWithoutAnimation() {
  if (!lastModelArrayBuffer) return;
  try {
    const { group, stats } = await loadGLB(lastModelArrayBuffer);
    if (currentModel) { scene.remove(currentModel); if (bboxHelper) scene.remove(bboxHelper); }
    currentModel = group;
    scene.add(group);
    if (wireframeMode) currentModel.traverse(c => { if (c.isMesh) c.material.wireframe = true; });
    const box = new THREE.Box3().setFromObject(group);
    bboxHelper = new THREE.Box3Helper(box, 0x333333);
    scene.add(bboxHelper);
    bboxHelper.visible = bboxVisible;
  } catch (e) {
    console.error('Error reloading model:', e);
  }
}

// ===== Handle animation file input =====
async function handleAnimationFile(file) {
  if (!file.name.toLowerCase().endsWith('.glb')) { alert('Please select a .glb animation file'); return; }
  if (!currentModel) { alert('Load a model first before applying animation'); return; }

  try {
    document.getElementById('loading').classList.add('visible');
    const ab = await file.arrayBuffer();
    const clips = await loadAnimationGLB(ab);

    if (clips.length === 0) {
      alert('No animations found in this GLB file');
      return;
    }

    externalAnimClips = clips;
    applyAnimation(clips, file.name.replace('.glb', ''));

  } catch (e) {
    console.error('Animation load error:', e);
    alert('Error loading animation: ' + e.message);
  } finally {
    document.getElementById('loading').classList.remove('visible');
    document.getElementById('anim-file-input').value = '';
  }
}

document.getElementById('anim-file-input').addEventListener('change', e => {
  if (e.target.files[0]) handleAnimationFile(e.target.files[0]);
});

// ===== Stats Extraction (custom parser) =====
function getAccData(g, b, i) {
  const a = g.accessors[i], bv = g.bufferViews[a.bufferView], o = (bv.byteOffset || 0) + (a.byteOffset || 0);
  const ts = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4, MAT4: 16 }[a.type], c = a.count * ts;
  const T = { 5120: Int8Array, 5121: Uint8Array, 5122: Int16Array, 5123: Uint16Array, 5125: Uint32Array, 5126: Float32Array }[a.componentType] || Float32Array;
  return { data: new T(b, o, c), count: a.count, type: a.type };
}

function extractStats(g) {
  let tV = 0, tT = 0, tP = 0;
  const mc = g.meshes ? g.meshes.length : 0, matC = g.materials ? g.materials.length : 0, texC = g.textures ? g.textures.length : 0;
  const hasA = g.animations && g.animations.length > 0, aC = g.animations ? g.animations.length : 0;
  const hasS = g.skins && g.skins.length > 0;
  let jC = 0; if (g.skins) g.skins.forEach(s => { jC += s.joints ? s.joints.length : 0; });
  const pm = [];

  // Per-primitive detail (for wearable analysis)
  const primDetails = [];

  if (g.meshes) g.meshes.forEach((m, mi) => {
    let v = 0, t = 0, p = m.primitives.length; tP += p;
    const ms = new Set();
    m.primitives.forEach((pr, pi) => {
      let pv = 0, pt = 0;
      if (pr.attributes.POSITION !== undefined) { pv = g.accessors[pr.attributes.POSITION].count; v += pv; }
      if (pr.indices !== undefined) { pt = g.accessors[pr.indices].count / 3; t += pt; }
      if (pr.material !== undefined) ms.add(pr.material);

      const matName = (pr.material !== undefined && g.materials) ? (g.materials[pr.material].name || ('Material_' + pr.material)) : 'No material';
      primDetails.push({
        meshName: m.name || ('Mesh_' + mi),
        meshIndex: mi,
        primIndex: pi,
        materialName: matName,
        materialIndex: pr.material,
        vertices: pv,
        triangles: Math.floor(pt),
      });
    });
    tV += v; tT += t;
    pm.push({ name: m.name || ('Mesh_' + mi), vertices: v, triangles: Math.floor(t), primitives: p, materials: ms.size });
  });

  return { vertices: tV, triangles: Math.floor(tT), meshes: mc, materials: matC, textures: texC, hasAnimations: hasA, animationCount: aC, hasSkinning: hasS, jointCount: jC, totalPrimitives: tP, perMesh: pm, primDetails };
}

// ===== Deep Info =====
function extractDeepInfo(g, bin) {
  const info = { cameras: [], lights: [], textureDetails: [], materialDetails: [], extensionsUsed: g.extensionsUsed || [], skinCount: g.skins ? g.skins.length : 0 };

  if (g.cameras) g.cameras.forEach((c, i) => info.cameras.push({ index: i, name: c.name || ('Camera_' + i), type: c.type }));
  if (g.extensions && g.extensions.KHR_lights_punctual && g.extensions.KHR_lights_punctual.lights)
    g.extensions.KHR_lights_punctual.lights.forEach((l, i) => info.lights.push({ index: i, name: l.name || ('Light_' + i), type: l.type }));

  if (g.nodes) g.nodes.forEach((n, i) => {
    if (n.camera !== undefined && !info.cameras.find(c => c.index === n.camera)) info.cameras.push({ index: n.camera, name: n.name || 'Camera', type: 'node-ref' });
    if (n.extensions && n.extensions.KHR_lights_punctual) info.lights.push({ index: n.extensions.KHR_lights_punctual.light, name: n.name || ('Light_' + i), type: 'node-ref' });
  });

  if (g.images && g.textures) g.textures.forEach((tex, i) => {
    const img = g.images[tex.source !== undefined ? tex.source : i]; if (!img) return;
    let name = img.name || tex.name || ('Texture_' + i), w = '?', h = '?', mime = img.mimeType || 'unknown', sz = 0;
    if (img.bufferView !== undefined && bin) {
      const bv = g.bufferViews[img.bufferView], ib = new Uint8Array(bin, bv.byteOffset || 0, bv.byteLength); sz = bv.byteLength;
      if (ib[0] === 0x89 && ib[1] === 0x50) { mime = 'image/png'; const d = new DataView(ib.buffer, ib.byteOffset); w = d.getUint32(16, false); h = d.getUint32(20, false); }
      else if (ib[0] === 0xFF && ib[1] === 0xD8) { mime = 'image/jpeg'; let o = 2; while (o < ib.length - 10) { if (ib[o] === 0xFF) { const m = ib[o + 1]; if (m === 0xC0 || m === 0xC2) { const d = new DataView(ib.buffer, ib.byteOffset); h = d.getUint16(o + 5, false); w = d.getUint16(o + 7, false); break; } o += 2 + ((ib[o + 2] << 8) | ib[o + 3]); } else o++; } }
      else if (ib[8] === 0x57 && ib[9] === 0x45 && ib[10] === 0x42 && ib[11] === 0x50) { mime = 'image/webp'; if (ib[12] === 0x56 && ib[13] === 0x50 && ib[14] === 0x38 && ib[15] === 0x20) { const d = new DataView(ib.buffer, ib.byteOffset); w = d.getUint16(26, true) & 0x3FFF; h = d.getUint16(28, true) & 0x3FFF; } }
    }
    info.textureDetails.push({ index: i, name, width: w, height: h, mimeType: mime, sizeBytes: sz });
  });

  if (g.materials) g.materials.forEach((m, i) => {
    const p = m.pbrMetallicRoughness || {};
    info.materialDetails.push({ index: i, name: m.name || ('Material_' + i), doubleSided: m.doubleSided || false, alphaMode: m.alphaMode || 'OPAQUE',
      hasBaseColor: !!p.baseColorTexture, hasMetallicRoughness: !!p.metallicRoughnessTexture, hasNormal: !!m.normalTexture, hasOcclusion: !!m.occlusionTexture, hasEmissive: !!m.emissiveTexture });
  });
  return info;
}

// ===== Complexity Hotspot Detection =====
function detectHotspots(stats, deepInfo) {
  const groups = {};
  stats.primDetails.forEach(pd => {
    const prefix = pd.materialName.replace(/[\._]?\d+$/, '').replace(/\.001$/, '');
    if (!groups[prefix]) groups[prefix] = { prims: [], totalVerts: 0, totalTris: 0, materials: new Set() };
    groups[prefix].prims.push(pd);
    groups[prefix].totalVerts += pd.vertices;
    groups[prefix].totalTris += pd.triangles;
    groups[prefix].materials.add(pd.materialName);
  });

  const hotspots = [];
  for (const [prefix, group] of Object.entries(groups)) {
    if (group.materials.size >= 3) {
      let flatColorCount = 0;
      group.prims.forEach(p => {
        const mat = deepInfo.materialDetails.find(m => m.name === p.materialName);
        if (mat && !mat.hasBaseColor && !mat.hasMetallicRoughness && !mat.hasNormal && !mat.hasOcclusion && !mat.hasEmissive) {
          flatColorCount++;
        }
      });
      hotspots.push({ prefix, primCount: group.prims.length, materialCount: group.materials.size, totalVerts: group.totalVerts, totalTris: group.totalTris, flatColorCount, materials: [...group.materials] });
    }
  }
  return hotspots.sort((a, b) => b.primCount - a.primCount);
}

// ===== Analysis =====
function analyzeModel(group, stats, fileSize, deepInfo) {
  const box = new THREE.Box3().setFromObject(group), size = new THREE.Vector3(), center = new THREE.Vector3();
  box.getSize(size); box.getCenter(center);
  const h = size.y, hp = h >= 1.0 && h <= 2.0, hc = !hp && ((h >= 0.9 && h < 1.0) || (h > 2.0 && h <= 2.1));
  const hotspots = detectHotspots(stats, deepInfo);
  return { dimensions: { width: size.x, height: size.y, depth: size.z }, boundingBox: { min: box.min, max: box.max }, center, fileSize, stats, deepInfo, hotspots,
    guidelines: { height: { pass: hp, close: hc, value: h, min: 1.0, max: 2.0 } } };
}

// ===== Wearable Results =====
function renderWearableResults(a) {
  const { dimensions: d, stats: s, deepInfo: di, fileSize, hotspots } = a;
  const issues = [], warnings = [];

  if (s.meshes > 1) issues.push(`Multiple meshes (${s.meshes}) - should be single mesh`);
  if (di.cameras.length > 0) issues.push(`${di.cameras.length} camera(s) - remove`);
  if (di.lights.length > 0) issues.push(`${di.lights.length} light(s) - remove`);
  if (di.skinCount > 1) issues.push(`${di.skinCount} armatures - should be max 1`);

  if (s.totalPrimitives > 15) issues.push(`${s.totalPrimitives} primitives (draw calls) - too complex, combine materials`);
  else if (s.totalPrimitives > 8) warnings.push(`${s.totalPrimitives} primitives - consider reducing`);

  di.textureDetails.forEach(t => { if (typeof t.width === 'number' && (t.width > 2048 || t.height > 2048)) warnings.push(`"${t.name}" is ${t.width}x${t.height} - max 2048x2048`); });
  if (fileSize > 5 * 1024 * 1024) warnings.push(`File size ${fmt(fileSize)} - consider optimizing`);

  let st = '';
  if (!issues.length && !warnings.length) st = `<div class="status-badge pass"><span class="status-icon">&#10003;</span> Wearable looks clean</div>`;
  else if (issues.length) st = `<div class="status-badge fail"><span class="status-icon">&#10005;</span> ${issues.length} issue(s) found</div>`;
  else st = `<div class="status-badge warn"><span class="status-icon">&#9888;</span> ${warnings.length} warning(s)</div>`;

  let il = '';
  if (issues.length || warnings.length) {
    il = '<div class="issues-list">';
    issues.forEach(i => { il += `<div class="status-badge fail" style="font-size:11px;font-weight:500;padding:7px 12px;"><span class="status-icon" style="font-size:12px;">&#10005;</span> ${i}</div>`; });
    warnings.forEach(w => { il += `<div class="status-badge warn" style="font-size:11px;font-weight:500;padding:7px 12px;"><span class="status-icon" style="font-size:12px;">&#9888;</span> ${w}</div>`; });
    il += '</div>';
  }

  // Hotspot callouts
  let hsHTML = '';
  if (hotspots.length > 0) {
    hsHTML = '<div class="section-label">Complexity Hotspots</div>';
    hotspots.forEach(hs => {
      const flatNote = hs.flatColorCount > 0 ? ` (${hs.flatColorCount} are flat color only - could be baked into a single atlas)` : '';
      hsHTML += `<div class="hotspot-callout"><strong>"${hs.prefix}"</strong> uses <strong>${hs.materialCount} separate materials</strong> across ${hs.primCount} primitives = ${hs.primCount} draw calls.${flatNote}<br>Recommendation: combine into a single material with a texture atlas.</div>`;
    });
  }

  // Per-primitive breakdown
  let pbHTML = '';
  if (s.primDetails.length > 1) {
    const hotspotMats = new Set();
    hotspots.forEach(hs => hs.materials.forEach(m => hotspotMats.add(m)));

    pbHTML = `<div class="section-label">Primitives (Draw Calls) - ${s.totalPrimitives} total</div><div class="prim-breakdown">
      <div class="prim-row header"><span>Material</span><span class="num">Verts</span><span class="num">Tris</span><span class="num">Maps</span></div>`;
    s.primDetails.forEach(pd => {
      const mat = di.materialDetails.find(m => m.name === pd.materialName);
      let mapCount = 0;
      if (mat) { if (mat.hasBaseColor) mapCount++; if (mat.hasNormal) mapCount++; if (mat.hasMetallicRoughness) mapCount++; if (mat.hasOcclusion) mapCount++; if (mat.hasEmissive) mapCount++; }
      const isHot = hotspotMats.has(pd.materialName);
      pbHTML += `<div class="prim-row ${isHot ? 'hotspot' : ''}"><span class="prim-name" title="${pd.materialName}">${pd.materialName}</span><span class="num">${pd.vertices.toLocaleString()}</span><span class="num">${pd.triangles.toLocaleString()}</span><span class="num">${mapCount}</span></div>`;
    });
    pbHTML += '</div>';
  }

  // Texture details
  let th = '';
  if (di.textureDetails.length > 0) {
    th = '<div class="section-label">Textures</div><div class="metric-group">';
    di.textureDetails.forEach(t => {
      const res = (typeof t.width === 'number') ? `${t.width} x ${t.height}` : 'Unknown';
      const c = (typeof t.width === 'number' && (t.width > 2048 || t.height > 2048)) ? 'warn' : '';
      th += `<div class="metric-row"><span class="metric-label" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${t.name}">${t.name}</span><span class="metric-value ${c}">${res}</span></div>`;
    });
    th += '</div>';
  }

  // Material details
  let mth = '';
  if (di.materialDetails.length > 0) {
    mth = '<div class="section-label">Materials</div><div class="metric-group">';
    di.materialDetails.forEach(m => {
      const maps = [];
      if (m.hasBaseColor) maps.push('Color'); if (m.hasNormal) maps.push('Normal'); if (m.hasMetallicRoughness) maps.push('MetRough'); if (m.hasOcclusion) maps.push('AO'); if (m.hasEmissive) maps.push('Emissive');
      mth += `<div class="metric-row"><span class="metric-label" title="${m.name}" style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${m.name}</span><span class="metric-value" style="font-size:10px;font-weight:500;color:var(--text-dim)">${maps.join(', ') || 'No maps'}</span></div>`;
    });
    mth += '</div>';
  }

  // Extras
  let eh = '';
  if (di.cameras.length > 0 || di.lights.length > 0) {
    eh = '<div class="section-label">Unnecessary Nodes</div><div style="display:flex;flex-wrap:wrap;gap:3px;">';
    di.cameras.forEach(c => { eh += `<span class="node-tag">Camera: ${c.name}</span>`; });
    di.lights.forEach(l => { eh += `<span class="node-tag">Light: ${l.name}</span>`; });
    eh += '</div>';
  }

  const r = document.getElementById('results');
  r.innerHTML = `
    ${st}${il}${hsHTML}
    <div class="section-label">Complexity</div>
    <div class="metric-group">
      <div class="metric-row"><span class="metric-label">Meshes</span><span class="metric-value ${s.meshes > 1 ? 'fail' : 'pass'}">${s.meshes}${s.meshes === 1 ? ' &#10003;' : ' (should be 1)'}</span></div>
      <div class="metric-row"><span class="metric-label">Primitives (Draw Calls)</span><span class="metric-value ${s.totalPrimitives > 15 ? 'fail' : s.totalPrimitives > 8 ? 'warn' : ''}">${s.totalPrimitives}</span></div>
      <div class="metric-row"><span class="metric-label">Vertices</span><span class="metric-value">${s.vertices.toLocaleString()}</span></div>
      <div class="metric-row"><span class="metric-label">Triangles</span><span class="metric-value">${s.triangles.toLocaleString()}</span></div>
      <div class="metric-row"><span class="metric-label">Materials</span><span class="metric-value">${s.materials}</span></div>
      <div class="metric-row"><span class="metric-label">Textures</span><span class="metric-value">${s.textures}</span></div>
      <div class="metric-row"><span class="metric-label">Armatures</span><span class="metric-value ${di.skinCount > 1 ? 'fail' : ''}">${di.skinCount}${di.skinCount > 1 ? ' (too many)' : ''}</span></div>
      <div class="metric-row"><span class="metric-label">Joints</span><span class="metric-value">${s.jointCount}</span></div>
      <div class="metric-row"><span class="metric-label">Animations</span><span class="metric-value">${s.hasAnimations ? s.animationCount : 'None'}</span></div>
      <div class="metric-row"><span class="metric-label">Cameras</span><span class="metric-value ${di.cameras.length > 0 ? 'fail' : ''}">${di.cameras.length}${di.cameras.length > 0 ? ' (remove)' : ''}</span></div>
      <div class="metric-row"><span class="metric-label">Lights</span><span class="metric-value ${di.lights.length > 0 ? 'fail' : ''}">${di.lights.length}${di.lights.length > 0 ? ' (remove)' : ''}</span></div>
    </div>
    ${pbHTML}${th}${mth}${eh}
    <div class="section-label">Dimensions</div>
    <div class="metric-group">
      <div class="metric-row"><span class="metric-label">Width (X)</span><span class="metric-value">${d.width.toFixed(4)}m</span></div>
      <div class="metric-row"><span class="metric-label">Height (Y)</span><span class="metric-value">${d.height.toFixed(4)}m</span></div>
      <div class="metric-row"><span class="metric-label">Depth (Z)</span><span class="metric-value">${d.depth.toFixed(4)}m</span></div>
    </div>
    <div class="section-label">File</div>
    <div class="metric-group">
      <div class="metric-row"><span class="metric-label">File Size</span><span class="metric-value ${fileSize > 5 * 1024 * 1024 ? 'warn' : ''}">${fmt(fileSize)}</span></div>
      ${di.extensionsUsed.length > 0 ? `<div class="metric-row"><span class="metric-label">Extensions</span><span class="metric-value" style="font-size:10px;max-width:180px;text-align:right;word-break:break-word;color:var(--text-dim)">${di.extensionsUsed.join(', ')}</span></div>` : ''}
    </div>`;
  r.style.display = 'flex';
  document.getElementById('empty-state').style.display = 'none';
}

function fmt(b) { if (b < 1024) return b + ' B'; if (b < 1048576) return (b / 1024).toFixed(1) + ' KB'; return (b / 1048576).toFixed(2) + ' MB'; }

// ===== Toggles =====
function toggleWireframe() { wireframeMode = !wireframeMode; document.getElementById('wireframe-btn').classList.toggle('active', wireframeMode); if (currentModel) currentModel.traverse(c => { if (c.isMesh) c.material.wireframe = wireframeMode; }); }
function toggleBBox() { bboxVisible = !bboxVisible; document.getElementById('bbox-btn').classList.toggle('active', !bboxVisible); if (bboxHelper) bboxHelper.visible = bboxVisible; }
function toggleGrid() { gridVisible = !gridVisible; document.getElementById('grid-btn').classList.toggle('active', !gridVisible); if (gridHelper) gridHelper.visible = gridVisible; }

// ===== File Handling =====
async function handleFile(file) {
  if (!file.name.toLowerCase().endsWith('.glb')) { alert('Please drop a .glb file'); return; }
  document.getElementById('loading').classList.add('visible');
  document.getElementById('drop-zone').classList.add('hidden');
  try {
    const ab = await file.arrayBuffer(); lastFileSize = file.size;
    lastModelArrayBuffer = ab.slice(0); // store a copy
    const { group, stats } = await loadGLB(ab);

    // Clean up previous
    stopAnim();
    externalAnimClips = [];
    document.getElementById('anim-controls').classList.remove('visible');

    if (currentModel) { scene.remove(currentModel); if (bboxHelper) scene.remove(bboxHelper); }
    currentModel = group; scene.add(group);
    const di = extractDeepInfo(lastGltfJson, lastBinChunk), a = analyzeModel(group, stats, file.size, di);
    const box = new THREE.Box3().setFromObject(group);
    bboxHelper = new THREE.Box3Helper(box, 0x333333); scene.add(bboxHelper); bboxVisible = true;
    document.getElementById('bbox-btn').classList.remove('active');
    const ctr = new THREE.Vector3(), sz = new THREE.Vector3(); box.getCenter(ctr); box.getSize(sz);
    orbitState.target = ctr; orbitState.radius = Math.max(sz.x, sz.y, sz.z) * 2; orbitState.phi = Math.PI / 3; updateCamera();
    document.getElementById('three-canvas').style.display = 'block';
    document.getElementById('viewer-controls').classList.add('visible');
    document.getElementById('new-file-btn').style.display = 'block';
    document.getElementById('anim-load-btn').style.display = 'inline-block';
    if (currentMode === 'avatar') renderAvatarResults(a); else renderWearableResults(a);
    document.getElementById('header-subtitle').textContent = file.name + ' - ' + fmt(file.size);

    // If the model has built-in animations, auto-play the first one
    if (animClips.length > 0) {
      applyAnimation(animClips, animClips[0].name || 'Built-in');
    }
  } catch (e) { console.error(e); alert('Error: ' + e.message); document.getElementById('drop-zone').classList.remove('hidden'); }
  finally { document.getElementById('loading').classList.remove('visible'); }
}

// ===== Drag & Drop =====
const dz = document.getElementById('drop-zone'), vp = document.getElementById('viewer-panel');
['dragenter', 'dragover'].forEach(e => vp.addEventListener(e, ev => { ev.preventDefault(); ev.stopPropagation(); if (!currentModel) dz.classList.add('active'); dz.classList.remove('hidden'); }));
['dragleave', 'drop'].forEach(e => vp.addEventListener(e, ev => { ev.preventDefault(); ev.stopPropagation(); dz.classList.remove('active'); }));
vp.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (!file) return;

  // If we already have a model loaded and the drop is an animation file, treat as animation
  if (currentModel && file.name.toLowerCase().includes('anim')) {
    handleAnimationFile(file);
  } else if (currentModel && file.name.toLowerCase().endsWith('.glb')) {
    // Ask: is this a new model or an animation?
    // For simplicity, if the file is small (<2MB) and we have a model, assume it might be animation
    // Otherwise treat as new model. User can always use the "Apply Animation" button for explicit choice.
    handleFile(file);
  } else {
    handleFile(file);
  }
});
document.getElementById('file-input').addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

document.getElementById('new-file-btn').addEventListener('click', () => {
  stopAnim();
  externalAnimClips = [];
  animClips = [];
  if (currentModel) { scene.remove(currentModel); currentModel = null; }
  if (bboxHelper) { scene.remove(bboxHelper); bboxHelper = null; }
  lastGltfJson = null; lastBinChunk = null; lastModelArrayBuffer = null;
  document.getElementById('three-canvas').style.display = 'none';
  document.getElementById('viewer-controls').classList.remove('visible');
  document.getElementById('anim-controls').classList.remove('visible');
  document.getElementById('new-file-btn').style.display = 'none';
  document.getElementById('anim-load-btn').style.display = 'none';
  document.getElementById('drop-zone').classList.remove('hidden');
  document.getElementById('results').style.display = 'none';
  document.getElementById('empty-state').style.display = 'flex';
  document.getElementById('header-subtitle').textContent = 'Open Avatar Studio';
  document.getElementById('file-input').value = '';
  wireframeMode = false; document.getElementById('wireframe-btn').classList.remove('active');
  resetCamera();
});

// ===== MML URL Loading =====
async function loadFromMML() {
  const input = document.getElementById('mml-url-input');
  const errEl = document.getElementById('url-error');
  const btn = document.getElementById('mml-load-btn');
  const url = input.value.trim();
  errEl.style.display = 'none';

  if (!url) { errEl.textContent = 'Please enter a URL'; errEl.style.display = 'block'; return; }

  btn.disabled = true;
  btn.textContent = 'Loading...';

  try {
    // Fetch the MML document
    const mmlResp = await fetch(url);
    if (!mmlResp.ok) throw new Error('Failed to fetch MML (' + mmlResp.status + ')');
    const mmlText = await mmlResp.text();

    // Extract GLB URL from m-character or m-model src attribute
    let glbUrl = null;
    const srcMatch = mmlText.match(/src=["']([^"']+\.glb[^"']*)/i);
    if (srcMatch) {
      glbUrl = srcMatch[1];
    } else {
      const glbMatch = mmlText.match(/(https?:\/\/[^\s"'<>]+\.glb[^\s"'<>]*)/i);
      if (glbMatch) glbUrl = glbMatch[1];
    }

    if (!glbUrl) throw new Error('No GLB file found in MML document');

    // Resolve relative URLs
    if (!glbUrl.startsWith('http')) {
      const base = new URL(url);
      glbUrl = new URL(glbUrl, base).href;
    }

    // Show loading overlay
    document.getElementById('loading').classList.add('visible');
    document.getElementById('drop-zone').classList.add('hidden');

    // Fetch the GLB binary
    const glbResp = await fetch(glbUrl);
    if (!glbResp.ok) throw new Error('Failed to fetch GLB (' + glbResp.status + ')');
    const ab = await glbResp.arrayBuffer();
    const fileSize = ab.byteLength;

    const fileName = glbUrl.split('/').pop().split('?')[0] || 'model.glb';

    lastFileSize = fileSize;
    lastModelArrayBuffer = ab.slice(0);

    // Clean up previous
    stopAnim();
    externalAnimClips = [];
    document.getElementById('anim-controls').classList.remove('visible');

    const { group, stats } = await loadGLB(ab);
    if (currentModel) { scene.remove(currentModel); if (bboxHelper) scene.remove(bboxHelper); }
    currentModel = group; scene.add(group);
    const di = extractDeepInfo(lastGltfJson, lastBinChunk), a = analyzeModel(group, stats, fileSize, di);
    const box = new THREE.Box3().setFromObject(group);
    bboxHelper = new THREE.Box3Helper(box, 0x333333); scene.add(bboxHelper); bboxVisible = true;
    document.getElementById('bbox-btn').classList.remove('active');
    const ctr = new THREE.Vector3(), sz = new THREE.Vector3(); box.getCenter(ctr); box.getSize(sz);
    orbitState.target = ctr; orbitState.radius = Math.max(sz.x, sz.y, sz.z) * 2; orbitState.phi = Math.PI / 3; updateCamera();
    document.getElementById('three-canvas').style.display = 'block';
    document.getElementById('viewer-controls').classList.add('visible');
    document.getElementById('new-file-btn').style.display = 'block';
    document.getElementById('anim-load-btn').style.display = 'inline-block';
    if (currentMode === 'avatar') renderAvatarResults(a); else renderWearableResults(a);
    document.getElementById('header-subtitle').textContent = fileName + ' - ' + fmt(fileSize);
    document.getElementById('loading').classList.remove('visible');

    // Auto-play built-in animations
    if (animClips.length > 0) {
      applyAnimation(animClips, animClips[0].name || 'Built-in');
    }

  } catch (e) {
    console.error('MML load error:', e);
    errEl.textContent = e.message;
    errEl.style.display = 'block';
    document.getElementById('loading').classList.remove('visible');
    document.getElementById('drop-zone').classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Load';
  }
}

// Enter key support for URL input
document.getElementById('mml-url-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadFromMML();
});

initScene();
</script>
