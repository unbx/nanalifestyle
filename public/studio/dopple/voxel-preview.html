// THREE.JS SETUP
// ════════════════════════════════════════
let scene, camera, renderer, animationId;
let particles = [];
let glowMeshes = [];
let time = 0;
let currentTheme = 0;

const wrap = document.getElementById('canvas-wrap');
const W = window.innerWidth, H = window.innerHeight;

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 500);
  camera.position.set(28, 22, 28);
  camera.lookAt(0, 2, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  wrap.appendChild(renderer.domElement);

  // Orbit controls (manual)
  setupOrbit();

  // Build UI
  buildThemeList();

  // Load first theme
  loadTheme(0);

  animate();
}

// ════════════════════════════════════════
// ORBIT CONTROLS (manual)
// ════════════════════════════════════════
let isDragging = false;
let prevX = 0, prevY = 0;
let orbitAngle = Math.PI / 4;
let orbitPitch = 0.5;
let orbitDist = 38;

function setupOrbit() {
  const el = renderer.domElement;
  el.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
  el.addEventListener('mousemove', e => {
    if (!isDragging) return;
    orbitAngle -= (e.clientX - prevX) * 0.005;
    orbitPitch = Math.max(0.1, Math.min(1.2, orbitPitch + (e.clientY - prevY) * 0.005));
    prevX = e.clientX; prevY = e.clientY;
  });
  el.addEventListener('mouseup', () => isDragging = false);
  el.addEventListener('mouseleave', () => isDragging = false);
  el.addEventListener('wheel', e => {
    orbitDist = Math.max(15, Math.min(70, orbitDist + e.deltaY * 0.03));
  });
  // Touch
  el.addEventListener('touchstart', e => { isDragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; });
  el.addEventListener('touchmove', e => {
    if (!isDragging) return;
    orbitAngle -= (e.touches[0].clientX - prevX) * 0.005;
    orbitPitch = Math.max(0.1, Math.min(1.2, orbitPitch + (e.touches[0].clientY - prevY) * 0.005));
    prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
  });
  el.addEventListener('touchend', () => isDragging = false);
}

function updateCamera() {
  if (!isDragging) orbitAngle += 0.002; // slow auto rotate
  camera.position.x = Math.cos(orbitAngle) * Math.cos(orbitPitch) * orbitDist;
  camera.position.y = Math.sin(orbitPitch) * orbitDist;
  camera.position.z = Math.sin(orbitAngle) * Math.cos(orbitPitch) * orbitDist;
  camera.lookAt(0, 3, 0);
}

// ════════════════════════════════════════
// VOXEL HELPERS
// ════════════════════════════════════════
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const boxGeoTall = new THREE.BoxGeometry(1, 2, 1);

function vox(x, y, z, color, emissive = false, eIntensity = 0.3) {
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: emissive ? 0.3 : 0.85, metalness: emissive ? 0.1 : 0.0,
    emissive: emissive ? color : 0x000000,
    emissiveIntensity: emissive ? eIntensity : 0
  });
  const m = new THREE.Mesh(boxGeo, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  if (emissive) glowMeshes.push(m);
  return m;
}

function voxTall(x, y, z, color, emissive = false, eInt = 0.3) {
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: emissive ? 0.3 : 0.85, metalness: 0.0,
    emissive: emissive ? color : 0x000000,
    emissiveIntensity: emissive ? eInt : 0
  });
  const m = new THREE.Mesh(boxGeoTall, mat);
  m.position.set(x, y + 0.5, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  if (emissive) glowMeshes.push(m);
  return m;
}

function pointLight(x, y, z, color, intensity, dist) {
  const l = new THREE.PointLight(color, intensity, dist);
  l.position.set(x, y, z);
  scene.add(l);
  return l;
}

function addParticles(count, color, yRange, spread, size = 0.12) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    pos[i*3] = (Math.random()-0.5) * spread;
    pos[i*3+1] = Math.random() * yRange;
    pos[i*3+2] = (Math.random()-0.5) * spread;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color, size, transparent: true, opacity: 0.7 });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  particles.push(pts);
  return pts;
}

// ════════════════════════════════════════

function buildGround(color, size = 30) {
  for (let x = -size/2; x < size/2; x++) {
    for (let z = -size/2; z < size/2; z++) {
      if (Math.random() < 0.7) vox(x, 0, z, color);
    }
  }
}

function buildRiftZone() {
  // Fractured terrain
  for (let x = -14; x < 14; x++) {

      const r = Math.random();
      if (r < 0.3) continue; // gaps
      const y = r > 0.8 ? Math.floor(Math.random()*3) : 0;
      vox(x, y, z, C.void);
    }
  }
  // Rift cracks (purple glow)
  for (let i = 0; i < 50; i++) {
    const x = Math.floor((Math.random()-0.5)*24);
    const z = Math.floor((Math.random()-0.5)*24);
    vox(x, 0.02, z, C.rift, true, 0.7);
  }
  // Flux red seams
  for (let i = 0; i < 25; i++) {
    const x = Math.floor((Math.random()-0.5)*20);
    const z = Math.floor((Math.random()-0.5)*20);
    vox(x, 0.01, z, C.flux, true, 0.5);
  }
  // Floating fragments
  for (let i = 0; i < 12; i++) {
    const fx = (Math.random()-0.5)*20;
    const fy = 4 + Math.random()*8;
    const fz = (Math.random()-0.5)*20;
    const s = 1 + Math.floor(Math.random()*2);
    for (let dx = 0; dx < s; dx++) for (let dz = 0; dz < s; dz++) {
      vox(Math.floor(fx)+dx, Math.floor(fy), Math.floor(fz)+dz, C.dusk);
    }
    vox(Math.floor(fx), Math.floor(fy)+1, Math.floor(fz), C.rift, true, 0.5);

  // Central rift column
  for (let y = 0; y < 12; y++) {

  addParticles(100, C.rift, 18, 30, 0.12);
  addParticles(60, C.flux, 12, 25, 0.08);

function buildCrystalDepths() {

      vox(x, 0, z, C.abyss);

    }
  }
  // Crystals (cyan)
  for (let i = 0; i < 20; i++) {
    const cx = Math.floor((Math.random()-0.5)*22);
    const cz = Math.floor((Math.random()-0.5)*22);

    for (let y = 1; y <= h; y++) {

    }
    pointLight(cx, h+1, cz, C.cyan, 0.4, 6);
  }
  // Mint coral

  for (let i = 0; i < 3; i++) {
    const mx = Math.floor((Math.random()-0.5)*14);
    const mz = Math.floor((Math.random()-0.5)*14);
    voxTall(mx, 2, mz, C.marigold);
  }
  // Coral accent spots
  for (let i = 0; i < 3; i++) {
    const cx = Math.floor((Math.random()-0.5)*12);
    const cz = Math.floor((Math.random()-0.5)*12);
    vox(cx, 2, cz, C.coral);
    vox(cx, 1, cz, C.coral);
  }
  addParticles(100, 0xFFD080, 12, 32, 0.08); // dust in sunbeams
  addParticles(60, 0xF0E0C0, 10, 26, 0.06); // steam wisps
  addParticles(40, 0xFFD700, 8, 22, 0.05); // golden motes
}

function buildMintHaven() {
  // White stone terrace ground
  for (let x = -16; x < 16; x++) {
    for (let z = -16; z < 16; z++) {
      vox(x, 0, z, C.lightCream);
    }
  }
  // Stone terraces (stepped levels)
  for (let level = 1; level <= 3; level++) {
    const count = 20 - level * 5;
    for (let i = 0; i < count; i++) {
      const tx = Math.floor((Math.random()-0.5)*(28-level*4));
      const tz = Math.floor((Math.random()-0.5)*(28-level*4));
      vox(tx, level, tz, C.pearl);
    }
  }
  // Shallow mint pools
  for (let i = 0; i < 8; i++) {
    const px = Math.floor((Math.random()-0.5)*18);
    const pz = Math.floor((Math.random()-0.5)*18);
    for (let dx = 0; dx < 3; dx++) for (let dz = 0; dz < 3; dz++) {
      vox(px+dx, 0.5, pz+dz, C.softCyan);
      if (Math.random() > 0.5) vox(px+dx, 1, pz+dz, 0x80FFB8);
    }
  }
  // Zen stone placements
  for (let i = 0; i < 6; i++) {
    const zx = Math.floor((Math.random()-0.5)*20);
    const zz = Math.floor((Math.random()-0.5)*20);
    vox(zx, 1, zz, C.stone);
  }
  // Teal deeper water pool accents
  for (let i = 0; i < 3; i++) {
    const tx = Math.floor((Math.random()-0.5)*16);
    const tz = Math.floor((Math.random()-0.5)*16);
    vox(tx, 0.5, tz, C.teal);
    vox(tx, 1, tz, C.teal);
  }
  // Emerald lush vegetation blocks
  for (let i = 0; i < 4; i++) {
    const ex = Math.floor((Math.random()-0.5)*14);
    const ez = Math.floor((Math.random()-0.5)*14);
    voxTall(ex, 1, ez, C.emerald);
  }
  addParticles(80, 0xE8F8F8, 12, 26, 0.06); // gentle mist
  addParticles(60, 0xA8E8E8, 10, 24, 0.05); // water ripples
  addParticles(40, 0xD8E8D8, 8, 20, 0.04); // pollen wisps
}

function buildPrismFields() {
  // White canvas ground
  for (let x = -16; x < 16; x++) {
    for (let z = -16; z < 16; z++) {
      vox(x, 0, z, C.lightCream);
    }
  }
  // Multicolor neon blocks scattered throughout (soft colors)
  const softColors = [C.softMagenta, C.softCyan, C.softYellow, C.softPulse, C.softRift];
  for (let i = 0; i < 50; i++) {
    const bx = Math.floor((Math.random()-0.5)*28);
    const bz = Math.floor((Math.random()-0.5)*28);
    const h = 1 + Math.floor(Math.random()*3);
    const color = softColors[Math.floor(Math.random()*softColors.length)];
    for (let y = 1; y <= h; y++) {
      vox(bx, y, bz, color);
    }
  }
  // Additional scattered colored elements (soft colors)
  for (let i = 0; i < 30; i++) {
    const cx = Math.floor((Math.random()-0.5)*26);
    const cz = Math.floor((Math.random()-0.5)*26);
    const color = softColors[Math.floor(Math.random()*softColors.length)];
    vox(cx, 1, cz, color);
  }
  // Vivid midtone blocks scattered throughout - ruby, sapphire, emerald, marigold, amethyst
  const vividColors = [C.ruby, C.sapphire, C.emerald, C.marigold, C.amethyst];
  for (let i = 0; i < 25; i++) {
    const vx = Math.floor((Math.random()-0.5)*26);
    const vz = Math.floor((Math.random()-0.5)*26);
    const h = 1 + Math.floor(Math.random()*2);
    const color = vividColors[Math.floor(Math.random()*vividColors.length)];
    for (let y = 1; y <= h; y++) {
      vox(vx, y, vz, color);
    }
  }
  addParticles(120, C.softMagenta, 14, 32, 0.07); // rainbow confetti
  addParticles(80, C.softCyan, 12, 28, 0.06); // colored orbs
  addParticles(60, C.softPulse, 10, 24, 0.05); // light sparkles
}

function buildDawnTerrace() {
  // Golden hour warm stone ground
  for (let x = -16; x < 16; x++) {
    for (let z = -16; z < 16; z++) {
      vox(x, 0, z, C.softWarm);
    }
  }
  // Terraced gardens (stepped levels)
  const terraceLevels = [
    { y: 1, size: 24, count: 24 },
    { y: 2, size: 20, count: 16 },
    { y: 3, size: 14, count: 8 }
  ];
  terraceLevels.forEach(level => {
    for (let i = 0; i < level.count; i++) {
      const tx = Math.floor((Math.random()-0.5)*level.size);
      const tz = Math.floor((Math.random()-0.5)*level.size);
      vox(tx, level.y, tz, C.pearl);
    }
  });
  // Soft rose accents
  for (let i = 0; i < 8; i++) {
    const rx = Math.floor((Math.random()-0.5)*20);
    const rz = Math.floor((Math.random()-0.5)*20);
    vox(rx, 1, rz, C.softRose);
  }
  // Soft pulse green details
  for (let i = 0; i < 6; i++) {
    const gx = Math.floor((Math.random()-0.5)*18);
    const gz = Math.floor((Math.random()-0.5)*18);
    vox(gx, 1, gz, C.softPulse);
  }
  // Warm stone pillars
  for (let i = 0; i < 4; i++) {
    const px = Math.floor((Math.random()-0.5)*16);
    const pz = Math.floor((Math.random()-0.5)*16);
    for (let y = 1; y <= 3; y++) vox(px, y, pz, C.stone);
  }
  // Terracotta warm structures
  for (let i = 0; i < 3; i++) {
    const tx = Math.floor((Math.random()-0.5)*14);
    const tz = Math.floor((Math.random()-0.5)*14);
    voxTall(tx, 1, tz, C.terracotta);
  }
  // Burgundy accent blocks
  for (let i = 0; i < 3; i++) {
    const bx = Math.floor((Math.random()-0.5)*12);
    const bz = Math.floor((Math.random()-0.5)*12);
    vox(bx, 2, bz, C.burgundy);
  }
  // Marigold highlight blocks
  for (let i = 0; i < 2; i++) {
    const mx = Math.floor((Math.random()-0.5)*10);
    const mz = Math.floor((Math.random()-0.5)*10);
    vox(mx, 3, mz, C.marigold);
    vox(mx, 2, mz, C.marigold);
  }
  addParticles(100, 0xFFD080, 14, 30, 0.08); // golden dust
  addParticles(70, C.softRose, 12, 26, 0.06); // drifting petals
  addParticles(50, 0xFFE0A0, 10, 22, 0.05); // warm light rays
}

// ════════════════════════════════════════
// THEME LOADING
// ════════════════════════════════════════
function clearScene() {
  while (scene.children.length > 0) scene.remove(scene.children[0]);
  particles = [];
  glowMeshes = [];
}

function loadTheme(idx) {
  currentTheme = idx;
  const t = themes[idx];
  clearScene();

  // Background
  scene.background = new THREE.Color(t.fog.color);
  scene.fog = new THREE.Fog(t.fog.color, t.fog.near, t.fog.far);

  // Lights
  const amb = new THREE.AmbientLight(t.ambientColor, t.ambientInt);
  scene.add(amb);
  const key = new THREE.DirectionalLight(t.keyColor, t.keyInt);
  key.position.set(10, 15, 8);
  key.castShadow = true;
  key.shadow.mapSize.width = 1024;
  key.shadow.mapSize.height = 1024;
  scene.add(key);
  const fill = new THREE.DirectionalLight(t.fillColor, t.fillInt);
  fill.position.set(-8, 5, -6);
  scene.add(fill);

  // Build world
  t.build();

  // Update UI
  updateUI(t);
  updateThemeButtons(idx);
}

// ════════════════════════════════════════
// UI
// ════════════════════════════════════════
function buildThemeList() {
  const list = document.getElementById('theme-list');
  themes.forEach((t, i) => {
    // Add light theme separator
    if (i === 8) { // after 8 dark themes
      const sep = document.createElement('div');
      sep.className = 'theme-section-label';
      sep.textContent = 'Light Themes';
      list.appendChild(sep);
    }

    const btn = document.createElement('button');
    btn.className = 'theme-btn' + (t.isLight ? ' light-theme' : '');
    btn.style.setProperty('--tc', '#' + t.colors[0].toString(16).padStart(6,'0'));
    btn.style.setProperty('--tg', 'rgba(' + ((t.colors[0]>>16)&255) + ',' + ((t.colors[0]>>8)&255) + ',' + (t.colors[0]&255) + ',0.3)');
    const dot = document.createElement('span');
    dot.className = 'theme-dot-sm';
    dot.style.background = '#' + t.colors[0].toString(16).padStart(6,'0');
    dot.style.boxShadow = '0 0 6px ' + btn.style.getPropertyValue('--tg');
    btn.appendChild(dot);
    btn.appendChild(document.createTextNode(t.name));
    btn.onclick = () => loadTheme(i);
    list.appendChild(btn);
  });
}

function updateThemeButtons(idx) {
  document.querySelectorAll('.theme-btn').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
  });
}

function hexStr(c) { return '#' + c.toString(16).padStart(6, '0').toUpperCase(); }

function updateUI(t) {
  // Update theme name color
  const nameEl = document.getElementById('theme-name');
  nameEl.textContent = t.name;
  nameEl.style.color = hexStr(t.colors[0]);
  // Adapt main title & eyebrow for light/dark backgrounds
  const mainTitle = document.getElementById('main-title');
  const mainTitleSpan = mainTitle.querySelector('span');
  const eyebrow = document.getElementById('eyebrow');
  const taglineEl = document.getElementById('theme-tagline');

  if (t.isLight) {
    nameEl.style.color = '#1A1A28';
    nameEl.style.textShadow = 'none';
    // Main title: dark text for light backgrounds
    mainTitle.style.color = '#1A1A28';
    mainTitleSpan.style.color = '#5A8A20';
    mainTitleSpan.style.textShadow = 'none';
    // Eyebrow
    eyebrow.style.color = '#5A8A20';
    // Tagline
    taglineEl.style.color = '#4A4A66';
  } else {
    nameEl.style.textShadow = '0 0 20px ' + hexStr(t.colors[0]) + '66';
    // Main title: light/neon for dark backgrounds
    mainTitle.style.color = '#EDE8DC';
    mainTitleSpan.style.color = '#B8FF5C';
    mainTitleSpan.style.textShadow = '0 0 20px rgba(184,255,92,0.5)';
    // Eyebrow
    eyebrow.style.color = '#B8FF5C';
    // Tagline
    taglineEl.style.color = '#2A2A40';
  }

  taglineEl.textContent = t.tagline;
  document.getElementById('mood-text').textContent = t.mood.join(' · ');
  document.getElementById('materials-text').textContent = t.materials;
  document.getElementById('particles-text').textContent = t.particles;

  // Update info cards styling for light themes
  const infoCards = document.querySelectorAll('.info-card');
  const infoLabels = document.querySelectorAll('.info-label');
  const infoValues = document.querySelectorAll('.info-value');
  infoCards.forEach(el => el.classList.toggle('light-bg', t.isLight));
  infoLabels.forEach(el => el.classList.toggle('light-text', t.isLight));
  infoValues.forEach(el => el.classList.toggle('light-text', t.isLight));

  // Update drag hint for light themes
  const dragHint = document.querySelector('.drag-hint');
  dragHint.classList.toggle('light-text', t.isLight);

  const dots = document.getElementById('palette-dots');
  dots.innerHTML = '';
  t.colors.forEach(c => {
    const d = document.createElement('div');
    d.className = 'palette-dot';
    d.style.background = hexStr(c);
    const r = (c>>16)&255, g = (c>>8)&255, b = c&255;
    if (r + g + b > 100) d.style.boxShadow = `0 0 8px rgba(${r},${g},${b},0.5)`;
    else d.style.border = '1px solid #1A1A28';
    dots.appendChild(d);
  });
}

// ════════════════════════════════════════
// ANIMATE
// ════════════════════════════════════════
function animate() {
  animationId = requestAnimationFrame(animate);
  time += 0.016;

  updateCamera();

  // Animate particles
  particles.forEach(p => {
    p.rotation.y += 0.001;
    const pos = p.geometry.attributes.position.array;
    for (let i = 1; i < pos.length; i += 3) {
      pos[i] += Math.sin(time + i) * 0.003;
    }
    p.geometry.attributes.position.needsUpdate = true;
  });

  // Pulse glow meshes
  glowMeshes.forEach((m, i) => {
    if (m.material.emissiveIntensity !== undefined) {
      const base = m.material.userData?.baseEmissive || m.material.emissiveIntensity;
      if (!m.material.userData) m.material.userData = { baseEmissive: base };
      m.material.emissiveIntensity = base + Math.sin(time * 2 + i * 0.7) * base * 0.2;
    }
  });

  renderer.render(scene, camera);
}

// ════════════════════════════════════════
// RESIZE
// ════════════════════════════════════════
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// GO
init();
</script>
